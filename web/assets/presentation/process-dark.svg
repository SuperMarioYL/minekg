ont-weight="400">2025</text><text x="530.0" y="259.0" fill="#b29cad" font-size="17" text-anchor="start" font-weight="400">Match 小张 to 张三</text><rect x="746.0" y="176" width="210.0" height="122" rx="12" fill="#131019" stroke="#3a1824"/><text x="764.0" y="207.0" fill="#fdeef7" font-size="21" text-anchor="start" font-weight="400">04  Review</text><text x="764.0" y="236.4" fill="#fdeef7" font-size="21" text-anchor="start" font-weight="400">amount rows</text><text x="764.0" y="259.0" fill="#b29cad" font-size="17" text-anchor="start" font-weight="400">200 + 300 = 500</text><text x="44" y="379.0" fill="#f6acd5" font-size="20" text-anchor="start" font-weight="400">Gross amount sum with two source rows, not net cash flow.</text></svg>
