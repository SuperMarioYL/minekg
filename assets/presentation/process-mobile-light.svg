<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" data-palette="e65671-e7966a-f6acd5-b4b01fb6a1d0" role="img" aria-labelledby="process-mobile-light-title process-mobile-light-desc"><title id="process-mobile-light-title">MineKG process</title><desc id="process-mobile-light-desc">Gross amount sum with two source rows, not net cash flow.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="840"><stop stop-color="#bf475e"/><stop offset=".6" stop-color="#9a6447"/><stop offset="1" stop-color="#8f647c"/></linearGradient><radialGradient id="halo"><stop stop-color="#bf475e" stop-opacity=".22"/><stop offset="1" stop-color="#fef9fa" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbd4" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#bf475e" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="840" rx="16" fill="#fef9fa"/><rect width="400" height="840" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="361.2" rx="200.0" ry="588.0" fill="url(#halo)"/><text x="28" y="44" fill="#725e70" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="28" y="84.0" fill="#27161f" font-size="25" text-anchor="start" font-weight="400">Query the supplied</text><text x="28" y="119.0" fill="#27161f" font-size="25" text-anchor="start" font-weight="400">synthetic exports</text><path d="M200 257V290" fill="none" stroke="#bf475e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#8f647c" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#fef7f8" stroke="#f7cbd4"/><text x="46" y="166.0" fill="#27161f" font-size="21" text-anchor="start" font-weight="400">01  Import records</text><text x="46" y="218.0" fill="#725e70" font-size="17" text-anchor="start" font-weight="400">Eleven records, three sources</text><path d="M200 412V445" fill="none" stroke="#bf475e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#8f647c" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#fef7f8" stroke="#f7cbd4"/><text x="46" y="321.0" fill="#27161f" font-size="21" text-anchor="start" font-weight="400">02  Link aliases</text><text x="46" y="373.0" fill="#725e70" font-size="17" text-anchor="start" font-weight="400">One ambiguity retained</text><path d="M200 567V600" fill="none" stroke="#bf475e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 567V600" class="flow" fill="none" stroke="#8f647c" stroke-width="2"/><rect x="28" y="445" width="344" height="122" rx="12" fill="#fef7f8" stroke="#f7cbd4"/><text x="46" y="476.0" fill="#27161f" font-size="21" text-anchor="start" font-weight="400">03  Query year 2025</text><text x="46" y="528.0" fill="#725e70" font-size="17" text-anchor="start" font-weight="400">Match 小张 to 张三</text><rect x="28" y="600" width="344" height="122" rx="12" fill="#fef7f8" stroke="#f7cbd4"/><text x="46" y="631.0" fill="#27161f" font-size="21" text-anchor="start" font-weight="400">04  Review amount rows</text><text x="46" y="683.0" fill="#725e70" font-size="17" text-anchor="start" font-weight="400">200 + 300 = 500</text><text x="28" y="775.0" fill="#8f647c" font-size="18" text-anchor="start" font-weight="400">Gross amount sum with two source</text><text x="28" y="800.2" fill="#8f647c" font-size="18" text-anchor="start" font-weight="400">rows, not net cash flow.</text></svg>
